spring.application.name=nira-backend
server.port=8080

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Run these SQL commands in psql before starting:
#   CREATE DATABASE nira_db;
#   CREATE USER nira_user WITH PASSWORD 'nira_password';
#   GRANT ALL PRIVILEGES ON DATABASE nira_db TO nira_user;
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/nira_db
spring.datasource.username=nira_user
spring.datasource.password=Soham@31
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# update = auto-creates / updates tables from Java entity classes (dev only)
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# Secret must be at least 32 characters (256 bits) for HS256
# CHANGE THIS before deploying to production
jwt.secret=nira-dev-secret-key-change-before-production-deploy-2026
# Token expires after 24 hours (milliseconds)
jwt.expiration=86400000
