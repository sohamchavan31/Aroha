name: Mobile CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
    paths:
      - 'aroha-mobile/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'aroha-mobile/**'

jobs:
  check:
    name: Install & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aroha-mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aroha-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Expo config is valid
        run: npx expo config --type public
