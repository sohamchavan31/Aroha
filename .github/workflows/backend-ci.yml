name: Backend CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
    paths:
      - 'nira-backend/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'nira-backend/**'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nira-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn verify
        # Tests use H2 in-memory DB (src/test/resources/application.properties)
        # No PostgreSQL needed in CI
