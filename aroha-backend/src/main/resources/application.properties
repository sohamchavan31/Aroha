spring.application.name=aroha-backend
spring.config.import=optional:classpath:application-secret.properties
server.port=8080

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Credentials loaded from environment variables or application-secret.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# update = auto-creates / updates tables from Java entity classes (dev only)
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# Secret must be at least 32 characters (256 bits) for HS256
# CHANGE THIS before deploying to production
jwt.secret=aroha-dev-secret-key-change-before-production-deploy-2026
# Token expires after 24 hours (milliseconds)
jwt.expiration=86400000

# ── AI Service (aroha-ai Flask) ─────────────────────────────────────────────
aroha.ai.url=http://localhost:5000
