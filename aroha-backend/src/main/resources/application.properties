spring.application.name=aroha-backend
spring.config.import=optional:classpath:application-secret.properties
server.port=8080

# ── Error responses ──────────────────────────────────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── PostgreSQL ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool (Neon cloud keep-alive) ────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# Real secret lives in application-secret.properties (gitignored) — see JWT_SECRET there.
jwt.secret=${JWT_SECRET:aroha-dev-secret-key-change-before-production-deploy-2026}
jwt.expiration=86400000

# ── AI Service ──────────────────────────────────────────────────────────────
aroha.ai.url=http://localhost:5000
# Shared secret with the Flask AI service — real value in application-secret.properties
aroha.ai.internal-key=${AI_INTERNAL_KEY:}